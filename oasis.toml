# Oasis 系统配置文件

[telemetry]
log_level = "info"
log_format = "text"
log_no_ansi = false

[nats]
url = "tls://127.0.0.1:4222"

[grpc]
url = "https://localhost:50051"

[tls]
certs_dir = "./certs"

[server]
listen_addr = "0.0.0.0:50051"
heartbeat_ttl_sec = 60

[rate_limit]
[rate_limit.nats]
max_operations = 100
time_window_ms = 1000
max_wait_time_ms = 500

[rate_limit.heartbeat]
max_operations = 10
time_window_ms = 1000
max_wait_time_ms = 100

[rate_limit.task_publish]
max_operations = 20
time_window_ms = 1000
max_wait_time_ms = 1000
